<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Web Lớp</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <!-- FORM ĐĂNG KÝ -->
        <div id="registerForm" class="form-wrapper active">
            <h2>Đăng ký tài khoản</h2>
            <form id="registerFormElement">
                <div class="form-group">
                    <label>Tên hiển thị</label>
                    <input type="text" id="displayName" placeholder="Nguyễn Văn A" required />
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="nguyenvana" required />
                    <small id="usernameError" class="error-message"></small>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="email@example.com" required />
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="registerPassword" placeholder="Mật khẩu" required />
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu" required />
                </div>
                
                <!-- OTP Section -->
                <div id="otpSection" style="display:none;">
                    <div class="form-group">
                        <label>Mã OTP</label>
                        <div class="otp-wrapper">
                            <input type="text" id="otpCode" placeholder="Nhập mã 6 số" maxlength="6" />
                            <button type="button" id="sendOtpBtn" class="btn-otp">Gửi mã</button>
                        </div>
                        <small id="otpTimer" class="timer-text"></small>
                        <small id="otpError" class="error-message"></small>
                    </div>
                    <button type="button" id="verifyOtpBtn" class="btn-primary">Xác nhận</button>
                </div>
                
                <button type="submit" id="registerSubmitBtn" class="btn-primary">Đăng ký</button>
            </form>
            <p class="switch-link">
                Đã có tài khoản? <a href="#" id="switchToLogin">Đăng nhập</a>
            </p>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <div id="loginForm" class="form-wrapper">
            <div class="login-header">
                <h2>Đăng nhập</h2>
                <button type="button" id="exitBtn" class="btn-exit">✕</button>
            </div>
            <form id="loginFormElement">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="loginUsername" placeholder="Tên đăng nhập" required />
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Mật khẩu" required />
                </div>
                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn-primary">Đăng nhập</button>
                <p id="loginError" class="error-message"></p>
            </form>
            
            <!-- Quên mật khẩu - 2 lựa chọn -->
            <div id="forgotPasswordSection" style="display:none;">
                <h3>Quên mật khẩu</h3>
                <button type="button" id="forgotOtpBtn" class="btn-secondary">Gửi lại mã OTP</button>
                <button type="button" id="contactAdminBtn" class="btn-secondary">Liên hệ Admin</button>
                <a href="#" id="backToLoginLink" class="back-link">← Quay lại đăng nhập</a>
            </div>

            <!-- OTP Section cho quên mật khẩu -->
            <div id="forgotOtpSection" style="display:none;">
                <div class="form-group">
                    <label>Mã OTP</label>
                    <input type="text" id="forgotOtpCode" placeholder="Nhập mã OTP" maxlength="6" />
                    <button type="button" id="resendForgotOtpBtn" class="btn-otp">Gửi lại mã</button>
                </div>
                <button type="button" id="verifyForgotOtpBtn" class="btn-primary">Xác nhận</button>
            </div>

            <p class="switch-link">
                Chưa có tài khoản? <a href="#" id="switchToRegister">Đăng ký</a>
            </p>
        </div>

        <!-- Xác nhận đăng nhập thành công -->
        <div id="successLogin" style="display:none;">
            <h2>✅ Xác nhận đăng nhập</h2>
            <p id="emailConfirmMessage">Chúng tôi đã gửi mã về email <strong>nguyenv***@gmail.com</strong></p>
            <button type="button" id="quickLoginBtn" class="btn-primary">Mã đăng nhập nhanh</button>
            <p id="quickLoginError" class="error-message"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"
            }
        }
    </script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
