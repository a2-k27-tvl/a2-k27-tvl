<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Web - Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <!-- PHẦN ĐĂNG KÝ -->
        <div id="registerSection" class="form-section active">
            <h2>Đăng ký tài khoản</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Tên hiển thị</label>
                    <input type="text" id="displayName" placeholder="Nguyễn Văn A" required />
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="nguyenvana" required />
                    <small class="hint">Tên đăng nhập duy nhất, không trùng lặp</small>
                    <span id="usernameStatus" class="status-text"></span>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required />
                    <span id="emailStatus" class="status-text"></span>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Mật khẩu tối thiểu 6 ký tự" required />
                </div>
                
                <!-- PHẦN OTP -->
                <div id="otpSection" style="display: none;">
                    <div class="form-group">
                        <label>Mã OTP</label>
                        <div class="otp-group">
                            <input type="text" id="otpCode" placeholder="Nhập mã 6 số" maxlength="6" />
                            <button type="button" id="sendOtpBtn" class="btn-otp">Gửi mã</button>
                        </div>
                        <small id="otpTimer" class="hint"></small>
                        <span id="otpStatus" class="status-text"></span>
                    </div>
                    <button type="submit" id="verifyOtpBtn" class="btn-primary">Xác nhận</button>
                </div>
                
                <button type="button" id="showRegisterBtn" class="btn-primary">Đăng ký</button>
            </form>
            <p class="switch-link">
                Đã có tài khoản? <a href="#" id="switchToLogin">Đăng nhập</a>
            </p>
        </div>

        <!-- PHẦN ĐĂNG NHẬP -->
        <div id="loginSection" class="form-section">
            <h2>Đăng nhập</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập" required />
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required />
                </div>
                <div class="form-actions">
                    <a href="#" id="forgotPasswordLink">Quên mật khẩu?</a>
                    <button type="submit" class="btn-primary">Đăng nhập</button>
                </div>
            </form>
            <p class="switch-link">
                Chưa có tài khoản? <a href="#" id="switchToRegister">Đăng ký</a>
            </p>
        </div>

        <!-- PHẦN QUÊN MẬT KHẨU -->
        <div id="forgotSection" class="form-section">
            <h2>Quên mật khẩu</h2>
            <form id="forgotForm">
                <div class="form-group">
                    <label>Nhập email của bạn</label>
                    <input type="email" id="forgotEmail" placeholder="your@email.com" required />
                </div>
                <div class="form-actions">
                    <button type="button" id="sendOtpForgotBtn" class="btn-primary">Gửi mã OTP</button>
                    <button type="button" id="contactAdminBtn" class="btn-secondary">Liên hệ Admin</button>
                </div>
                <div id="otpForgotSection" style="display: none;">
                    <div class="form-group">
                        <label>Mã OTP</label>
                        <input type="text" id="otpForgotCode" placeholder="Nhập mã 6 số" maxlength="6" />
                    </div>
                    <button type="submit" id="resetPasswordBtn" class="btn-primary">Xác nhận và đặt lại mật khẩu</button>
                </div>
            </form>
            <p class="switch-link">
                <a href="#" id="backToLogin">Quay lại đăng nhập</a>
            </p>
        </div>

        <!-- PHẦN XÁC THỰC 2 BƯỚC -->
        <div id="verifySection" class="form-section">
            <h2>Xác thực đăng nhập</h2>
            <p id="verifyMessage">Chúng tôi đã gửi mã về email của bạn</p>
            <div class="form-group">
                <label>Mã xác thực</label>
                <input type="text" id="verifyCode" placeholder="Nhập mã 6 số" maxlength="6" />
            </div>
            <div class="form-actions">
                <button type="button" id="verifyLoginBtn" class="btn-primary">Xác nhận</button>
            </div>
            <p class="switch-link">
                <a href="#" id="resendVerifyBtn">Gửi lại mã</a>
            </p>
        </div>
    </div>

        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

            authDomain: "a2-k27-tvl.firebaseapp.com",
            projectId: "a2-k27-tvl",
            storageBucket: "a2-k27-tvl.firebasestorage.app",
            messagingSenderId: "992341533498",
            appId: "1:992341533498:web:44358a92094d0771e7e603",

        window.db = database;

    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
